[build-system]
requires = ["setuptools >= 61.0", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "tomato-psutil"
authors = [
    {name = "Peter Kraus"},
]
maintainers = [
    {name = "Peter Kraus", email = "peter.kraus@tu-berlin.de"},
]
description = "tomato driver interface to the psutil library"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">= 3.11"
dependencies = [
    "psutil >= 5.9",
    "tomato >= 3.0.0rc7",
]

[project.optional-dependencies]
testing = ["pytest"]
docs = [
    "sphinx ~= 7.2",
    "sphinx-rtd-theme ~= 1.3.0",
    "autodoc-pydantic ~= 1.9.0",
    "sphinxcontrib-mermaid ~= 0.9.2",
]

[project.urls]
Documentation = "https://dgbowl.github.io/tomato-psutil/main"
Issues = "https://github.com/dgbowl/tomato-psutil/issues"
Repository = "https://github.com/dgbowl/tomato-psutil/"

[project.scripts]


[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}.dev{ccount}"
dirty_template = "{tag}.dev{ccount}"

[tool.ruff]
